{{- if .Values.rbac.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "reflector.fullname" . }}
  labels:
    {{- include "reflector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
{{- end }}
